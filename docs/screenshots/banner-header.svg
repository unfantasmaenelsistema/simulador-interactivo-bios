<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="150" y1="0" x2="150" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1050" y1="0" x2="1050" y2="480" />
  </g>

  <!-- Cyber circuit glow rings -->
  <circle cx="1020" cy="240" r="180" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="1020" cy="240" r="140" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3" />
  <circle cx="1020" cy="240" r="90" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 8" />

  <!-- Hexagonal Chip Decorative Icon -->
  <g transform="translate(970, 190)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <!-- CPU Die simulation -->
    <rect x="25" y="25" width="50" height="50" rx="6" fill="#0284c7" opacity="0.4" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="50" y="55" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UEFI</text>
    <text x="50" y="66" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">BIOS ROM</text>
    <!-- Chip pins -->
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="50" y1="-8" x2="50" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="80" y1="-8" x2="80" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="20" y1="100" x2="20" y2="108" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="50" y1="100" x2="50" y2="108" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="80" y1="100" x2="80" y2="108" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Brand badge -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="17" r="7" fill="#10b981" />
    <circle cx="18" cy="17" r="11" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
    <text x="36" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">UN FANTASMA EN EL SISTEMA</text>
    <text x="245" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PROYECTO</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
    Simulador Interactivo de BIOS
  </text>
  
  <text x="80" y="225" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">
    Legacy Phoenix (1990s) &amp; UEFI Gaming Moderno
  </text>

  <!-- Subtitle -->
  <text x="80" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
    Plataforma didáctica para aprender configuración de hardware, secuencia POST,
  </text>
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
    test de estrés de estabilidad, teclas de acceso por marcas y flasheo de firmware.
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(80, 345)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="80" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Dual BIOS &amp; POST</text>
    
    <!-- Tag 2 -->
    <rect x="175" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="265" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔥 Test de Estrés Real</text>

    <!-- Tag 3 -->
    <rect x="370" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="465" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔄 Flasheo EZ Flash 3</text>

    <!-- Tag 4 -->
    <rect x="575" y="0" width="170" height="34" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="660" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎯 Retos y Misiones</text>
  </g>

  <!-- URL link pill bottom -->
  <g transform="translate(80, 410)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="13">Web Oficial:</text>
    <text x="95" y="16" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">https://unfantasmaenelsistema.com</text>
  </g>
</svg>
