<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#030712" />

  <!-- Left Half: Brand Keys Quick Guide -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="540" height="595" rx="12" fill="url(#splitBg)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="540" height="56" rx="12" fill="#1e293b" />
    <text x="24" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">
      ⌨️ Guía Interactiva de Teclas de Acceso BIOS / Boot
    </text>

    <!-- Table Header -->
    <g transform="translate(24, 75)">
      <text x="0" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">FABRICANTE / PLACA</text>
      <text x="260" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ENTRAR A BIOS</text>
      <text x="400" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">BOOT MENU</text>
      <line x1="0" y1="28" x2="492" y2="28" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Brand Rows -->
    <g transform="translate(24, 125)">
      <!-- ASUS -->
      <rect x="0" y="0" width="492" height="42" rx="6" fill="#1e293b" opacity="0.6"/>
      <text x="12" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ASUS (Placas base y portátiles)</text>
      <rect x="256" y="8" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="25" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DEL / F2</text>
      <rect x="396" y="8" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="25" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F8</text>

      <!-- Gigabyte / AORUS -->
      <rect x="0" y="50" width="492" height="42" rx="6" fill="#111827" />
      <text x="12" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gigabyte / AORUS</text>
      <rect x="256" y="58" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="75" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DEL / F2</text>
      <rect x="396" y="58" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="75" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F12</text>

      <!-- MSI -->
      <rect x="0" y="100" width="492" height="42" rx="6" fill="#1e293b" opacity="0.6"/>
      <text x="12" y="126" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MSI (Micro-Star Int.)</text>
      <rect x="256" y="108" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="125" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DEL</text>
      <rect x="396" y="108" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="125" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F11</text>

      <!-- Dell / Alienware -->
      <rect x="0" y="150" width="492" height="42" rx="6" fill="#111827" />
      <text x="12" y="176" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dell &amp; Alienware</text>
      <rect x="256" y="158" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="175" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F2</text>
      <rect x="396" y="158" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="175" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F12</text>

      <!-- HP / Omen -->
      <rect x="0" y="200" width="492" height="42" rx="6" fill="#1e293b" opacity="0.6"/>
      <text x="12" y="226" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">HP &amp; OMEN</text>
      <rect x="256" y="208" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="225" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F10 / ESC</text>
      <rect x="396" y="208" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="225" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F9</text>

      <!-- Lenovo / ThinkPad -->
      <rect x="0" y="250" width="492" height="42" rx="6" fill="#111827" />
      <text x="12" y="276" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Lenovo &amp; Legion</text>
      <rect x="256" y="258" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="286" y="275" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F2 / Novo</text>
      <rect x="396" y="258" width="50" height="26" rx="4" fill="#334155" />
      <text x="421" y="275" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F12</text>
    </g>

    <!-- POST Simulator Launch Shortcut -->
    <g transform="translate(24, 465)">
      <rect x="0" y="0" width="492" height="52" rx="8" fill="#047857" opacity="0.8" stroke="#10b981" stroke-width="1"/>
      <text x="246" y="32" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        ▶ Simular POST con Marca Seleccionada
      </text>
    </g>
  </g>

  <!-- Right Half: Missions & Educational Challenges -->
  <g transform="translate(620, 40)">
    <rect x="0" y="0" width="540" height="595" rx="12" fill="url(#splitBg)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="540" height="56" rx="12" fill="#1e293b" />
    <text x="24" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">
      🎯 Modo Misiones: Retos Técnicos Reales
    </text>

    <!-- Mission 1 -->
    <g transform="translate(24, 80)">
      <rect x="0" y="0" width="492" height="110" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="16" y="28" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
        Misión 1: Preparar PC para Windows 11
      </text>
      <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        Requisitos obligatorios: TPM 2.0 (Intel PTT / fTPM) y Secure Boot en modo UEFI.
      </text>
      <rect x="16" y="68" width="120" height="26" rx="4" fill="#047857" />
      <text x="76" y="85" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ COMPLETADA</text>
      <text x="150" y="85" fill="#64748b" font-family="monospace" font-size="11">CSM Support: Disabled | TPM: Enabled</text>
    </g>

    <!-- Mission 2 -->
    <g transform="translate(24, 205)">
      <rect x="0" y="0" width="492" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
        Misión 2: Habilitar Entorno Docker &amp; WSL2
      </text>
      <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        Activa Intel Virtualization Technology (VT-x / AMD-V) y VT-d para IOMMU.
      </text>
      <rect x="16" y="68" width="100" height="26" rx="4" fill="#78350f" />
      <text x="66" y="85" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EN CURSO</text>
      <text x="130" y="85" fill="#94a3b8" font-family="monospace" font-size="11">Objetivo: Intel Virtualization = Enabled</text>
    </g>

    <!-- Mission 3 -->
    <g transform="translate(24, 330)">
      <rect x="0" y="0" width="492" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
        Misión 3: Overclocking de Memoria DDR5 (XMP)
      </text>
      <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        Lleva las memorias de 4800MHz JEDEC a 6000MHz y supera el test de estrés térmico.
      </text>
      <rect x="16" y="68" width="100" height="26" rx="4" fill="#334155" />
      <text x="66" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BLOQUEADA</text>
      <text x="130" y="85" fill="#64748b" font-family="monospace" font-size="11">Desbloquear tras Misión 2</text>
    </g>

    <!-- Rewards / Gamification Footer -->
    <g transform="translate(24, 465)">
      <rect x="0" y="0" width="492" height="52" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="24" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
        🏆 Progreso Total: 33% (1 de 3 completadas)
      </text>
      <rect x="330" y="16" width="140" height="20" rx="10" fill="#1f2937" />
      <rect x="330" y="16" width="46" height="20" rx="10" fill="#10b981" />
    </g>
  </g>
</svg>
