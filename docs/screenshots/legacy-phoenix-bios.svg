<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- CRT monitor raster scanline effect -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.18" />
    </pattern>
  </defs>

  <!-- Monitor Bezel -->
  <rect width="1200" height="675" fill="#1e1e24" />
  <rect x="25" y="25" width="1150" height="625" rx="12" fill="#0000aa" stroke="#555555" stroke-width="4" />

  <!-- Scanlines overlay -->
  <rect x="25" y="25" width="1150" height="625" rx="12" fill="url(#scanlines)" pointer-events="none" />

  <!-- Top Header Title Bar -->
  <rect x="35" y="35" width="1130" height="35" fill="#aaaaaa" />
  <text x="600" y="58" fill="#000000" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    ROM PCI/ISA BIOS (2A69KD01) - PHOENIX-AWARD BIOS SETUP UTILITY
  </text>

  <!-- Categories Tab Bar -->
  <g transform="translate(60, 95)">
    <text x="0" y="0" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="bold">
      [ <tspan fill="#ffff55">Standard CMOS Setup</tspan> ]    BIOS Features Setup    Chipset Features Setup    Power Management
    </text>
  </g>

  <!-- Main Box Borders (Double line ASCII-style) -->
  <rect x="55" y="115" width="1090" height="445" fill="none" stroke="#ffffff" stroke-width="2" />
  <line x1="720" y1="115" x2="720" y2="560" stroke="#ffffff" stroke-width="2" />

  <!-- Left Column: CMOS Options -->
  <g transform="translate(80, 155)">
    <!-- Option 1: Date -->
    <text x="0" y="0" fill="#ffff55" font-family="'Courier New', monospace" font-size="16" font-weight="bold">Date (mm:dd:yy) :</text>
    <text x="280" y="0" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Wed, Oct 11 2026</text>

    <!-- Option 2: Time -->
    <text x="0" y="28" fill="#ffff55" font-family="'Courier New', monospace" font-size="16" font-weight="bold">Time (hh:mm:ss) :</text>
    <text x="280" y="28" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">08 : 45 : 12</text>

    <line x1="0" y1="48" x2="600" y2="48" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4" />

    <!-- IDE Hard Disks -->
    <text x="0" y="75" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Primary Master   :</text>
    <text x="240" y="75" fill="#55ffff" font-family="'Courier New', monospace" font-size="16">WDC WD800BB-00CAA1 [80 GB]</text>

    <text x="0" y="103" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Primary Slave    :</text>
    <text x="240" y="103" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="16">None</text>

    <text x="0" y="131" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Secondary Master :</text>
    <text x="240" y="131" fill="#55ffff" font-family="'Courier New', monospace" font-size="16">SONY CD-RW CRX320E [ATAPI]</text>

    <text x="0" y="159" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Secondary Slave  :</text>
    <text x="240" y="159" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="16">None</text>

    <line x1="0" y1="179" x2="600" y2="179" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Drive A / Floppy -->
    <text x="0" y="206" fill="#ffff55" font-family="'Courier New', monospace" font-size="16">Drive A          :</text>
    <text x="240" y="206" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">1.44M, 3.5 in.</text>

    <!-- Floppy 3 Mode -->
    <text x="0" y="234" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Floppy 3 Mode    :</text>
    <text x="240" y="234" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Disabled</text>

    <!-- Video Display -->
    <text x="0" y="262" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">Video Display    :</text>
    <text x="240" y="262" fill="#ffffff" font-family="'Courier New', monospace" font-size="16">EGA/VGA</text>

    <!-- Halt On -->
    <rect x="-8" y="278" width="620" height="28" fill="#aa0000" />
    <text x="0" y="297" fill="#ffff55" font-family="'Courier New', monospace" font-size="16" font-weight="bold">Halt On          :</text>
    <text x="240" y="297" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="bold">[ All , But Keyboard ]</text>

    <!-- Memory Stats -->
    <g transform="translate(0, 335)">
      <text x="0" y="0" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="14">Base Memory    : 640K</text>
      <text x="240" y="0" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="14">Extended Mem   : 523264K</text>
      <text x="460" y="0" fill="#ffff55" font-family="'Courier New', monospace" font-size="14">Total: 512 MB</text>
    </g>
  </g>

  <!-- Right Column: Item Specific Help & PC Speaker -->
  <g transform="translate(745, 155)">
    <text x="0" y="0" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="bold">Item Help</text>
    <line x1="0" y1="12" x2="375" y2="12" stroke="#ffffff" stroke-width="1.5" />

    <text x="0" y="38" fill="#55ffff" font-family="'Courier New', monospace" font-size="14">Menu Level &gt;</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Courier New', monospace" font-size="13">Determines which errors will</text>
    <text x="0" y="90" fill="#ffffff" font-family="'Courier New', monospace" font-size="13">halt the system during POST.</text>
    
    <text x="0" y="125" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="13">• All Errors</text>
    <text x="0" y="145" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="13">• No Errors</text>
    <text x="0" y="165" fill="#ffff55" font-family="'Courier New', monospace" font-size="13">• All , But Keyboard &lt;--</text>
    <text x="0" y="185" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="13">• All , But Diskette</text>

    <!-- Beep PC Speaker indicator -->
    <rect x="0" y="240" width="375" height="110" fill="#000066" stroke="#55ffff" stroke-width="1" />
    <text x="16" y="268" fill="#ffff55" font-family="'Courier New', monospace" font-size="14" font-weight="bold">🔊 PC Speaker / Buzzer POST:</text>
    <text x="16" y="295" fill="#55ff55" font-family="'Courier New', monospace" font-size="13">• 1 Beep Corto: POST Correcto</text>
    <text x="16" y="315" fill="#ff5555" font-family="'Courier New', monospace" font-size="13">• Beeps Largos: Fallo RAM / GPU</text>
    <text x="16" y="335" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">[Sonidos Web Audio Sintéticos]</text>
  </g>

  <!-- Bottom Helper Keys Legend -->
  <rect x="55" y="570" width="1090" height="60" fill="#aaaaaa" />
  <g transform="translate(70, 595)">
    <text x="0" y="0" fill="#000000" font-family="'Courier New', monospace" font-size="13" font-weight="bold">
      ESC : Salir       ↑ ↓ → ← : Seleccionar Item        +/-/PU/PD : Modificar Valor        F10 : Guardar y Salir
    </text>
    <text x="0" y="22" fill="#000000" font-family="'Courier New', monospace" font-size="13" font-weight="bold">
      F1  : Ayuda General        F7 : Valores Óptimos     F8 : Telemetría HUD      F11 : Flashear ROM BIOS
    </text>
  </g>
</svg>
